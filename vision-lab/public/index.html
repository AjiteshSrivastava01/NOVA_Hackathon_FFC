<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Lab</title>
<style>
  :root {
    --ink: #230a0c; --mahogany: #3c1518; --garnet: #69140e; --apricot: #fee1c7;
    --coral: #fa7e61; --strawberry: #f44174; --cream: #fff6ee; --card: #fff; --muted: #7a3a3c;
    --border: 2px solid var(--ink); --shadow: 4px 4px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--cream); color: var(--ink); }
  header { background: var(--mahogany); color: var(--apricot); padding: 14px 16px; border-bottom: 4px solid var(--strawberry);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  header h1 { margin: 0; font-size: 1.3rem; }
  header .meta { font-size: .85rem; }
  header code { background: rgba(254,225,199,.15); padding: 2px 6px; border-radius: 4px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
  .wide { grid-column: 1 / -1; }
  h2 { margin: 0 0 10px; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
  .n { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--mahogany); color: var(--apricot); font-size: .8rem; }
  button, .btn { font: inherit; font-weight: 600; cursor: pointer; background: var(--card); color: var(--ink); border: var(--border);
    border-radius: 8px; padding: 8px 12px; box-shadow: 2px 2px 0 var(--ink); }
  button:active { transform: translate(2px, 2px); box-shadow: none; }
  button.primary { background: var(--mahogany); color: var(--apricot); }
  button.big { width: 100%; padding: 14px; font-size: 1.05rem; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, select { font: inherit; color: var(--ink); background: var(--card); border: var(--border); border-radius: 6px; padding: 6px 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  .hint { color: var(--muted); font-size: .85rem; }
  .line { border: 2px dashed rgba(35,10,12,.35); border-radius: 8px; padding: 10px; margin: 8px 0; background: var(--cream); }
  .line .top { display: grid; grid-template-columns: 1fr 64px auto; gap: 6px; }
  .mods { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: .85rem; }
  .mods select { padding: 2px 4px; font-size: .82rem; }
  .preview { width: 100%; max-height: 340px; object-fit: contain; border: var(--border); border-radius: 8px; background: #000; display: block; }
  .drop { border: 2px dashed var(--muted); border-radius: 8px; padding: 26px 12px; text-align: center; color: var(--muted); }
  .verdict { display: inline-block; font-weight: 800; font-size: 1.3rem; padding: 6px 16px; border-radius: 99px; border: var(--border); text-transform: uppercase; }
  .verdict.pass { background: var(--mahogany); color: var(--apricot); }
  .verdict.fail { background: var(--strawberry); color: var(--ink); }
  .verdict.needs_review { background: var(--coral); color: var(--ink); }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; margin: 6px 0 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1.5px solid rgba(35,10,12,.15); }
  th { background: var(--apricot); }
  td.ok { font-weight: 700; } td.bad { background: rgba(244,65,116,.2); font-weight: 800; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; border: 1.5px solid var(--ink); font-size: .8rem; font-weight: 700; }
  .chip.present { background: var(--apricot); } .chip.absent { background: #e9e2df; } .chip.unknown { background: var(--coral); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .stat { border: var(--border); border-radius: 8px; padding: 6px 10px; font-size: .85rem; background: var(--cream); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: .78rem; background: var(--cream); border: 1.5px solid rgba(35,10,12,.2); border-radius: 6px; padding: 8px; max-height: 300px; overflow: auto; }
  .history { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .h { border: var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--card); font-size: .78rem; }
  .h img { width: 100%; height: 90px; object-fit: cover; display: block; }
  .h div { padding: 4px 6px; }
  .err { background: var(--strawberry); color: var(--ink); border: var(--border); border-radius: 8px; padding: 10px; font-weight: 600; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid var(--apricot); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .resgrid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 14px; align-items: start; }
  @media (max-width: 640px) { .resgrid { grid-template-columns: 1fr; } .resgrid img { order: -1; max-height: 240px; } }
  video { width: 100%; border-radius: 8px; border: var(--border); background: #000; }
</style>
</head>
<body>
<header>
  <h1>🔬 Vision Lab</h1>
  <div class="meta" id="hdr">loading…</div>
</header>

<main>
  <section class="card">
    <h2><span class="n">1</span> The order (ticket)</h2>
    <div class="row">
      <button type="button" data-preset="nolettuce">Burger, no lettuce</button>
      <button type="button" data-preset="two">2 burgers + fries</button>
      <button type="button" data-preset="chicken">Chicken sandwich + soda</button>
    </div>
    <div id="lines"></div>
    <button type="button" id="add">+ Add dish</button>
  </section>

  <section class="card">
    <h2><span class="n">2</span> Photo of the meal</h2>
    <div class="row">
      <label class="btn">📷 Take / choose photo<input type="file" id="file" accept="image/*" capture="environment" hidden></label>
      <button type="button" id="webcam">💻 Use webcam</button>
    </div>
    <div id="cam" hidden>
      <video id="video" autoplay playsinline muted></video>
      <div class="row"><button type="button" class="primary" id="snap">Capture</button><button type="button" id="camclose">Close</button></div>
    </div>
    <img id="preview" class="preview" alt="meal photo" hidden>
    <div id="nophoto" class="drop">No photo yet. On a phone, "Take / choose photo" opens the camera.</div>

    <h2 style="margin-top:16px"><span class="n">3</span> Run</h2>
    <div class="row">
      <label>Model <input id="model" list="models" size="30" placeholder="provider/model"></label>
      <datalist id="models">
        <option value="google/gemini-3.8-flash"><option value="anthropic/claude-haiku-5.5">
        <option value="anthropic/claude-sonnet-5.5"><option value="google/gemini-3.1-flash-lite">
      </datalist>
    </div>
    <div class="row" id="pwrow" hidden><label>Lab password <input id="pw" type="password" autocomplete="current-password"></label></div>
    <button type="button" class="primary big" id="go" disabled>Inspect meal against ticket</button>
  </section>

  <section class="card wide" id="result" hidden></section>

  <section class="card wide">
    <h2>History <span class="hint">(this session only)</span></h2>
    <div id="history" class="history"><span class="hint">Nothing yet.</span></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let MENU = {}, photo = null, stream = null, defaultModel = "";
const history = [];
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// ---------- order builder ----------
function addLine(line = { menu_id: "burger", qty: 1, modifiers: {} }) {
  const d = document.createElement("div");
  d.className = "line";
  d.innerHTML = `<div class="top">
      <select class="dish">${Object.entries(MENU).map(([id, m]) => `<option value="${id}" ${id === line.menu_id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
      <input class="qty" type="number" min="1" max="10" value="${line.qty}" aria-label="quantity">
      <button type="button" class="rm" aria-label="remove">✕</button>
    </div><div class="mods"></div>`;
  const renderMods = (mods = {}) => {
    const comps = MENU[d.querySelector(".dish").value].components;
    d.querySelector(".mods").innerHTML = Object.entries(comps).filter(([, c]) => c.removable).map(([cid, c]) => `
      <label>${esc(c.name)} <select data-c="${cid}">
        <option value="">${c.default ? "yes (std)" : "no (std)"}</option>
        <option value="${c.default ? "no" : "add"}" ${mods[cid] ? "selected" : ""}>${c.default ? "NO" : "ADD"}</option>
      </select></label>`).join("") || `<span class="hint">no options</span>`;
  };
  d.querySelector(".dish").onchange = () => renderMods();
  d.querySelector(".rm").onclick = () => d.remove();
  renderMods(line.modifiers);
  $("#lines").appendChild(d);
}
function readOrder() {
  return [...document.querySelectorAll("#lines .line")].map((d) => ({
    menu_id: d.querySelector(".dish").value,
    qty: +d.querySelector(".qty").value || 1,
    modifiers: Object.fromEntries([...d.querySelectorAll("[data-c]")].filter((s) => s.value).map((s) => [s.dataset.c, s.value])),
  }));
}
const PRESETS = {
  nolettuce: [{ menu_id: "burger", qty: 1, modifiers: { lettuce: "no" } }],
  two: [{ menu_id: "burger", qty: 2, modifiers: {} }, { menu_id: "fries", qty: 1, modifiers: {} }],
  chicken: [{ menu_id: "chicken_sandwich", qty: 1, modifiers: {} }, { menu_id: "soda", qty: 1, modifiers: {} }],
};
document.querySelectorAll("[data-preset]").forEach((b) => (b.onclick = () => {
  $("#lines").innerHTML = ""; PRESETS[b.dataset.preset].forEach(addLine);
}));
$("#add").onclick = () => addLine();

// ---------- photo ----------
async function downscale(blob, max = 1280) {
  const img = await createImageBitmap(blob);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}
function setPhoto(dataUrl) {
  photo = dataUrl;
  $("#preview").src = dataUrl; $("#preview").hidden = false; $("#nophoto").hidden = true;
  $("#go").disabled = false;
}
$("#file").onchange = async (e) => { const f = e.target.files[0]; if (f) setPhoto(await downscale(f)); e.target.value = ""; };
$("#webcam").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    $("#video").srcObject = stream; $("#cam").hidden = false;
  } catch (e) { showError("Camera not available: " + e.message); }
};
const closeCam = () => { stream?.getTracks().forEach((t) => t.stop()); stream = null; $("#cam").hidden = true; };
$("#camclose").onclick = closeCam;
$("#snap").onclick = async () => {
  const v = $("#video");
  if (!v.videoWidth) return;
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  setPhoto(await downscale(await new Promise((r) => c.toBlob(r, "image/jpeg", 0.9))));
  closeCam();
};

// ---------- run ----------
function showError(msg) {
  const r = $("#result"); r.hidden = false;
  r.innerHTML = `<div class="err">⚠ ${esc(msg)}</div>`;
}
$("#go").onclick = async () => {
  const items = readOrder();
  if (!items.length) return showError("Add at least one dish to the order.");
  const btn = $("#go"); btn.disabled = true;
  const t0 = performance.now();
  const tick = setInterval(() => (btn.innerHTML = `<span class="spinner"></span> Looking… ${((performance.now() - t0) / 1000).toFixed(1)}s`), 100);
  store.set("lab-pw", $("#pw").value); store.set("lab-model", $("#model").value);
  try {
    const res = await fetch("/api/inspect", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-lab-password": $("#pw").value },
      body: JSON.stringify({ order: { items }, photo, model: $("#model").value.trim() || undefined }),
    });
    const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    const entry = { ...data, items, photo, at: new Date() };
    history.unshift(entry);
    render(entry); renderHistory();
  } catch (e) { showError(e.message); }
  finally { clearInterval(tick); btn.disabled = false; btn.textContent = "Inspect meal against ticket"; }
};

function render(e) {
  const o = e.observations;
  // Pair expected units with observed units of the same dish, in order (display only;
  // the verdict above comes from matching.js which pairs them optimally).
  const pool = {};
  for (const it of o.items || []) (pool[it.menu_id] ||= []).push(it);
  const counter = {};
  const tables = e.expected.map((u) => {
    const seen = (pool[u.menu_id] || []).shift();
    const n = (counter[u.menu_id] = (counter[u.menu_id] || 0) + 1);
    const rows = Object.entries(u.expected).map(([cid, want]) => {
      const got = seen?.components?.[cid] ?? "not seen";
      const ok = (want && got === "present") || (!want && got === "absent");
      return `<tr><td>${esc(MENU[u.menu_id].components[cid].name)}</td>
        <td><span class="chip ${want ? "present" : "absent"}">${want ? "present" : "absent"}</span></td>
        <td class="${ok ? "ok" : "bad"}"><span class="chip ${esc(got)}">${esc(got)}</span> ${ok ? "✓" : "✗"}</td></tr>`;
    }).join("");
    return `<h3>${esc(MENU[u.menu_id].name)}${counter[u.menu_id] > 1 || e.expected.filter((x) => x.menu_id === u.menu_id).length > 1 ? ` #${n}` : ""}${seen ? "" : ' <span class="chip unknown">not found in photo</span>'}</h3>
      <table><thead><tr><th>Ingredient</th><th>Ticket wants</th><th>Model saw</th></tr></thead><tbody>${rows}</tbody></table>`;
  }).join("");
  const extra = Object.values(pool).flat();
  const label = {
    photo: "NAME-THIS.jpg",
    ticket: e.items,
    truth: (o.retake ? [] : o.items).map((it) => ({ menu_id: it.menu_id, components: it.components })),
  };
  const r = $("#result"); r.hidden = false;
  r.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <span class="verdict ${e.verdict}">${{ pass: "✓ pass", fail: "✕ fail", needs_review: "? retake / review" }[e.verdict]}</span>
      <span class="hint">${e.at.toLocaleTimeString()}</span>
    </div>
    <ul>${e.reasons.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    ${o.retake ? `<div class="err">Retake: ${esc(o.retake_reason)}</div>` : ""}
    <div class="stats">
      <span class="stat">Model: <b>${esc(o.model)}</b></span>
      <span class="stat">Model time: <b>${o.latency_ms != null ? (o.latency_ms / 1000).toFixed(1) + "s" : "–"}</b></span>
      <span class="stat">Cost: <b>${o.cost_usd != null ? "$" + Number(o.cost_usd).toFixed(4) : "–"}</b></span>
      <span class="stat">Confidence: <b>${o.raw?.confidence ?? o.confidence ?? "–"}</b></span>
    </div>
    ${o.notes ? `<p class="hint">Model notes: ${esc(o.notes)}</p>` : ""}
    <div class="resgrid">
      <div>${tables}${extra.length ? `<h3>Extra items the model saw (not on ticket)</h3><p>${extra.map((x) => esc(MENU[x.menu_id]?.name || x.menu_id)).join(", ")}</p>` : ""}</div>
      <img src="${e.photo}" class="preview" alt="inspected photo">
    </div>
    <details><summary>Raw model output (JSON)</summary><pre>${esc(JSON.stringify(o, null, 2))}</pre></details>
    <details><summary>Save as a test case for vision-testset</summary>
      <p class="hint">1) Download the photo into <code>functions/vision-testset/</code>. 2) Copy this into <code>labels.json</code>, rename the photo,
      and <b>fix the truth</b> wherever the model was wrong.</p>
      <div class="row"><a class="btn" download="vision-test.jpg" href="${e.photo}">⬇ Download photo</a>
      <button type="button" id="copylabel">Copy label JSON</button></div>
      <pre id="labeljson">${esc(JSON.stringify(label, null, 2))}</pre>
    </details>`;
  $("#copylabel").onclick = async () => {
    try { await navigator.clipboard.writeText($("#labeljson").textContent); $("#copylabel").textContent = "Copied ✓"; }
    catch { $("#copylabel").textContent = "Select the text and copy"; }
  };
  r.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderHistory() {
  $("#history").innerHTML = history.map((h, i) => `
    <div class="h" data-i="${i}"><img src="${h.photo}" alt="">
      <div><span class="chip ${h.verdict === "pass" ? "present" : h.verdict === "fail" ? "unknown" : "absent"}">${h.verdict}</span><br>${esc(h.observations.model)}<br>${h.at.toLocaleTimeString()}</div></div>`).join("");
}
$("#history").onclick = (ev) => { const h = ev.target.closest("[data-i]"); if (h) render(history[+h.dataset.i]); };

// ---------- boot ----------
(async () => {
  const cfg = await (await fetch("/api/config")).json();
  MENU = cfg.menu; defaultModel = cfg.model;
  $("#hdr").innerHTML = `Default model <code>${esc(cfg.model)}</code> · key ${cfg.key_set ? "✓ set" : '<b style="color:var(--strawberry)">MISSING</b>'}`;
  $("#model").value = store.get("lab-model") || cfg.model;
  $("#pwrow").hidden = !cfg.password_required;
  $("#pw").value = store.get("lab-pw") || "";
  PRESETS.nolettuce.forEach(addLine);
})();
</script>
</body>
</html>
