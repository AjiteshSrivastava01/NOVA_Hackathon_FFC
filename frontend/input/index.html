<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFC Input</title>
<style>
  :root { --ink: #230a0c; --mahogany: #3c1518; --apricot: #fee1c7; --coral: #fa7e61; --strawberry: #f44174; --cream: #fff6ee; --muted: #7a3a3c; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--cream); color: var(--ink); }
  header { background: var(--mahogany); color: var(--apricot); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--strawberry); }
  header h1 { margin: 0; font-size: 1.15rem; }
  header a { color: var(--apricot); font-weight: 600; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .big { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 120px; font: inherit; font-size: 1.5rem; font-weight: 800;
    border: 3px solid var(--ink); border-radius: 18px; box-shadow: 6px 6px 0 var(--ink); cursor: pointer; user-select: none; text-align: center; }
  .big:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--ink); }
  .big.voice { background: var(--coral); color: var(--ink); }
  .big.camera { background: var(--mahogany); color: var(--apricot); }
  .big.rec { background: var(--strawberry); animation: pulse 1s infinite; }
  .big[aria-busy="true"] { opacity: .7; pointer-events: none; }
  @keyframes pulse { 50% { box-shadow: 6px 6px 0 var(--ink), 0 0 0 10px rgba(244,65,116,.25); } }
  .type { display: flex; gap: 8px; }
  .type input { flex: 1; font: inherit; padding: 10px; border: 2px solid var(--ink); border-radius: 10px; }
  button.small { font: inherit; font-weight: 700; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; cursor: pointer; }
  button.small.primary { background: var(--mahogany); color: var(--apricot); }
  .card { border: 3px solid var(--ink); border-radius: 14px; padding: 14px; background: #fff; }
  .card .who { font-weight: 800; font-size: 1.1rem; }
  .card .what { font-size: 1.2rem; margin: 6px 0 12px; }
  .card .heard { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; }
  .log { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .log li { border: 2px solid var(--ink); border-radius: 10px; padding: 10px 12px; background: #fff; font-weight: 600; }
  .log li.success { border-left: 10px solid var(--mahogany); }
  .log li.error { border-left: 10px solid var(--strawberry); background: #fff0f4; }
  .log li.warning { border-left: 10px solid var(--coral); }
  .log li small { display: block; font-weight: 400; color: var(--muted); margin-top: 3px; }
  .hint { color: var(--muted); font-size: .85rem; text-align: center; }
  .upload { align-self: center; margin-top: -6px; color: var(--ink); font-weight: 600; text-decoration: underline; cursor: pointer; }
  .camview { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; align-items: center; justify-content: center; }
  .camview video, .camview img { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .cam-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: max(12px, env(safe-area-inset-top)) 14px 12px; background: linear-gradient(rgba(0,0,0,.6), transparent); }
  .cam-hint { color: #fff; font-weight: 600; font-size: .9rem; text-align: center; flex: 1; text-shadow: 0 1px 3px #000; }
  .cam-btn { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.45); color: #fff; font-size: 1.3rem; cursor: pointer; }
  .cam-bottom { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 12px;
    padding: 18px 16px max(22px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.65)); }
  .cam-bottom .small { flex: 1; max-width: 240px; padding: 14px; font-size: 1.05rem; }
  .shutter { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; background: var(--strawberry); cursor: pointer;
    box-shadow: 0 0 0 4px rgba(0,0,0,.35); }
  .shutter:active { transform: scale(.92); }
  .flash { animation: flash .25s; }
  @keyframes flash { from { filter: brightness(3); } }
  .spin { width: 22px; height: 22px; border: 4px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header><h1>FFC Input</h1><a href="/">Dashboard →</a></header>
<main>
  <button class="big voice" id="mic" type="button">🎙 Add order</button>
  <div class="type"><input id="typed" placeholder="…or type it: 2 burgers no lettuce, fries" autocomplete="off"><button class="small" id="send" type="button">Add</button></div>

  <div class="card" id="confirm" hidden>
    <div class="who" id="c-who"></div>
    <div class="what" id="c-what"></div>
    <div class="heard" id="c-heard"></div>
    <div class="row"><button class="small primary" id="c-ok" type="button">✓ Add to dashboard</button><button class="small" id="c-no" type="button">✕ Cancel</button></div>
  </div>

  <button class="big camera" id="cam" type="button">📷 Check meal</button>
  <label class="upload">or upload a photo<input type="file" id="photo" accept="image/*" hidden></label>
  <input type="file" id="photo-capture" accept="image/*" capture="environment" hidden>

  <ul class="log" id="log"></ul>
  <p class="hint">Orders and checks show up on the dashboard automatically.</p>
</main>

<!-- Live camera -->
<div class="camview" id="camview" hidden role="dialog" aria-label="Camera">
  <video id="video" autoplay playsinline muted></video>
  <img id="shot" alt="Captured meal" hidden>
  <div class="cam-top"><button type="button" class="cam-btn" id="cam-close" aria-label="Close camera">✕</button>
    <span class="cam-hint" id="cam-hint">Fit the whole meal in the frame</span>
    <button type="button" class="cam-btn" id="cam-flip" aria-label="Switch camera" hidden>⟲</button></div>
  <div class="cam-bottom" id="cam-live"><button type="button" class="shutter" id="shutter" aria-label="Take photo"></button></div>
  <div class="cam-bottom" id="cam-review" hidden>
    <button type="button" class="small" id="retake">↺ Retake</button>
    <button type="button" class="small primary" id="use">✓ Check this meal</button>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let draft = null, rec = null;

function note(level, text, sub = "") {
  const li = document.createElement("li");
  li.className = level;
  li.innerHTML = `${esc(text)}${sub ? `<small>${esc(sub)}</small>` : ""}`;
  $("#log").prepend(li);
  while ($("#log").children.length > 6) $("#log").lastChild.remove();
}
async function post(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || data.error || `HTTP ${res.status}`);
  return data;
}
function busy(el, on, label) {
  el.setAttribute("aria-busy", on ? "true" : "false");
  if (label !== undefined) el.firstChild.nodeValue = label;
}

// ---------- voice ----------
function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE"); str(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) { const s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([buf], { type: "audio/wav" });
}
async function toWav(blob) {
  const ctx = new AudioContext();
  try {
    const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
    const rate = 16000, off = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * rate)), rate);
    const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start();
    return encodeWav((await off.startRendering()).getChannelData(0), rate);
  } finally { await ctx.close(); }
}
const dataUrl = (blob) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(blob); });

async function understand(body) {
  const mic = $("#mic");
  busy(mic, true, "Understanding… ");
  try {
    draft = await post("/api/voice/understand", body);
    $("#c-who").textContent = "New order";
    $("#c-what").textContent = draft.summary;
    $("#c-heard").textContent = draft.transcript ? `Heard: “${draft.transcript}”` : "";
    $("#confirm").hidden = false;
    if (draft.ai_error) note("warning", "AI unavailable, used the simple parser. Check the card.", draft.ai_error);
  } catch (e) { note("error", "Couldn't take that order", e.message); }
  finally { busy(mic, false, "🎙 Add order"); mic.classList.remove("rec"); }
}
$("#mic").onclick = async () => {
  const mic = $("#mic");
  if (!rec) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mr = new MediaRecorder(stream), chunks = [];
      mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      mr.start();
      rec = { mr, stream, chunks, timer: setTimeout(() => rec && mic.click(), 15000) };
      mic.classList.add("rec"); mic.firstChild.nodeValue = "● Listening… tap to stop";
    } catch (e) { note("error", "Microphone not available", "Use the text box instead. (" + e.message + ")"); }
    return;
  }
  const { mr, stream, chunks, timer } = rec; rec = null; clearTimeout(timer);
  const stopped = new Promise((r) => (mr.onstop = r));
  mr.stop(); await stopped; stream.getTracks().forEach((t) => t.stop());
  try { await understand({ audio_base64: await dataUrl(await toWav(new Blob(chunks, { type: mr.mimeType }))) }); }
  catch (e) { note("error", "Couldn't read the recording", e.message); busy(mic, false, "🎙 Add order"); mic.classList.remove("rec"); }
};
$("#send").onclick = () => { const t = $("#typed").value.trim(); if (t) understand({ text: t }); };
$("#typed").onkeydown = (e) => { if (e.key === "Enter") $("#send").click(); };
$("#c-no").onclick = () => { draft = null; $("#confirm").hidden = true; };
$("#c-ok").onclick = async () => {
  if (!draft) return;
  try {
    const o = await post("/api/orders", { items: draft.items, source: "voice" });
    note("success", `Order #${o.id} added`, draft.summary);
    $("#typed").value = "";
  } catch (e) { note("error", "Couldn't add the order", e.message); }
  draft = null; $("#confirm").hidden = true;
};

// ---------- camera ----------
async function downscale(file, max = 1280) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}
async function checkMeal(dataUrl) {
  const cam = $("#cam");
  busy(cam, true, "Checking… ");
  try {
    const r = await post("/api/check-meal", { photo: dataUrl });
    const level = { checked_off: "success", flagged: "error" }[r.outcome] || "warning";
    const checked = (r.compared || []).map((c) => `#${c.order_id} ${c.verdict === "pass" ? "✓" : c.verdict === "different dishes" ? "–" : "✕"}`).join("  ");
    note(level, r.message, [r.seen && `Camera saw: ${r.seen}`, r.warning, checked && `Checked: ${checked}`].filter(Boolean).join(" · "));
  } catch (err) { note("error", "Couldn't check the meal", err.message); }
  finally { busy(cam, false, "📷 Check meal"); }
}
async function fromFile(e) {
  const file = e.target.files[0]; e.target.value = "";
  if (file) await checkMeal(await downscale(file));
}
$("#photo").onchange = fromFile;          // "or upload a photo"
$("#photo-capture").onchange = fromFile;  // phone's own camera app (fallback)

// ---------- live camera ----------
let camStream = null, facing = "environment", shotUrl = null;
const canLiveCamera = () => !!(navigator.mediaDevices?.getUserMedia && window.isSecureContext);
function showLive(live) {
  $("#video").hidden = !live; $("#cam-live").hidden = !live;
  $("#shot").hidden = live; $("#cam-review").hidden = live;
  $("#cam-hint").textContent = live ? "Fit the whole meal in the frame" : "Is the whole meal visible?";
}
async function openCamera() {
  // Live camera needs HTTPS or localhost. Otherwise use the phone's camera app.
  if (!canLiveCamera()) { $("#photo-capture").click(); return; }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
    });
  } catch (e) {
    note("warning", "Couldn't open the camera", `${e.message}. Use "or upload a photo" instead.`);
    return;
  }
  $("#video").srcObject = camStream;
  showLive(true);
  $("#camview").hidden = false;
  try {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
    $("#cam-flip").hidden = cams.length < 2;
  } catch { $("#cam-flip").hidden = true; }
}
function closeCamera() {
  camStream?.getTracks().forEach((t) => t.stop());
  camStream = null; shotUrl = null;
  $("#video").srcObject = null;
  $("#camview").hidden = true;
}
$("#cam").onclick = openCamera;
$("#cam-close").onclick = closeCamera;
$("#cam-flip").onclick = async () => {
  facing = facing === "environment" ? "user" : "environment";
  closeCamera();
  await openCamera();
};
$("#shutter").onclick = () => {
  const v = $("#video");
  if (!v.videoWidth) return;
  const k = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  shotUrl = c.toDataURL("image/jpeg", 0.85);
  $("#shot").src = shotUrl;
  $("#camview").classList.remove("flash"); void $("#camview").offsetWidth; $("#camview").classList.add("flash");
  showLive(false);
};
$("#retake").onclick = () => showLive(true);
$("#use").onclick = () => {
  const url = shotUrl;
  closeCamera();
  if (url) checkMeal(url);
};
document.addEventListener("keydown", (e) => {
  if ($("#camview").hidden) return;
  if (e.key === "Escape") closeCamera();
  if (e.key === " " && !$("#cam-live").hidden) { e.preventDefault(); $("#shutter").click(); }
});
</script>
</body>
</html>
